{% extends "base.html" %}
{% block title %}پنل مدرس{% endblock %}
{% block robots %}noindex, nofollow{% endblock %}
{% block nav %}<a href="{{ url_for('admin.panel') }}">پنل مدرس</a>{% endblock %}
{% block content %}
<section class="card">
  <h1>پنل مدرس</h1>
  <ul>
    <li><a href="{{ url_for('admin.availability') }}">مدیریت روزها و بازه‌ها</a></li>
    <li><a href="{{ url_for('admin.reservations') }}">رزروها</a></li>
    <li><a href="{{ url_for('admin.payments') }}">پرداخت‌ها و کیف پول‌ها</a></li>
  </ul>
  <form method="post" action="{{ url_for('admin.logout') }}" class="inline">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button type="submit" class="linklike">خروج از پنل</button>
  </form>
</section>
{% endblock %}

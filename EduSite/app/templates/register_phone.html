{% extends "base.html" %}
{% block title %}ورود / ثبت‌نام — {{ config.SITE_NAME }}{% endblock %}
{% block content %}
<section class="card">
  <h1>{{ 'ورود' if login_mode else 'ثبت‌نام' }}</h1>
  <p>شماره موبایل خود را وارد کنید.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('auth.login' if login_mode else 'auth.register') }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="phone">شماره موبایل</label>
    <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel"
           placeholder="09xxxxxxxxx" required>
    <button type="submit" class="btn btn-primary">ارسال کد تأیید</button>
  </form>
</section>
{% endblock %}
